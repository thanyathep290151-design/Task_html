<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนนักศึกษาใหม่</title>
</head>
<body>
    <header>
        <h1>ระบบลงทะเบียนนักศึกษาใหม่</h1>
        <p>กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้องเพื่อใช้ในการลงทะเบียนเข้าศึกษาต่อ</p>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>หมวดที่ 1: ข้อมูลการเข้าสู่ระบบ</legend>

                <p>
                    <label for="username">ชื่อผู้ใช้ (Username):</label><br>
                    <input type="text" id="username" name="username" required>
                </p>

                <p>
                    <label for="password">รหัสผ่าน (Password):</label><br>
                    <input type="password" id="password" name="password" required>
                </p>
            </fieldset>

            <br>

            <fieldset>
                <legend>หมวดที่ 2: ข้อมูลส่วนตัว</legend>

                <p>
                    <label for="fullname">ชื่อ-นามสกุล:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="เช่น นายสมชาย ใจดี">
                </p>

                <p>
                    <label for="email">อีเมล:</label><br>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="birthdate">วัน/เดือน/ปีเกิด:</label><br>
                    <input type="date" id="birthdate" name="birthdate">
                </p>

                <p>
                    เพศ:<br>
                    <input type="radio" id="gender_male" name="gender" value="male">
                    <label for="gender_male">ชาย</label>

                    <input type="radio" id="gender_female" name="gender" value="female">
                    <label for="gender_female">หญิง</label>

                    <input type="radio" id="gender_other" name="gender" value="other">
                    <label for="gender_other">อื่นๆ</label>
                </p>
            </fieldset>

            <br>

            <fieldset>
                <legend>หมวดที่ 3: ข้อมูลการศึกษา</legend>

                <p>
                    <label for="education_level">ระดับชั้น:</label><br>
                    <select id="education_level" name="education_level">
                        <option value="ปวช.1">ปวช.1</option>
                        <option value="ปวช.2">ปวช.2</option>
                        <option value="ปวช.3">ปวช.3</option>
                        <option value="ปวส.1">ปวส.1</option>
                        <option value="ปวส.2">ปวส.2</option>
                    </select>
                </p>

                <p>
                    ความสนใจเพิ่มเติม:<br>
                    <input type="checkbox" id="interest_web" name="interests" value="Web Design">
                    <label for="interest_web">Web Design</label><br>

                    <input type="checkbox" id="interest_db" name="interests" value="Database">
                    <label for="interest_db">Database</label><br>

                    <input type="checkbox" id="interest_coding" name="interests" value="Coding">
                    <label for="interest_coding">Coding</label>
                </p>

                <p>
                    <label for="address">ที่อยู่ปัจจุบัน:</label><br>
                    <textarea id="address" name="address" rows="4" cols="50"></textarea>
                </p>
            </fieldset>

            <br>

            <div>
                <button type="submit">ลงทะเบียน</button>
                <button type="reset">ล้างข้อมูล</button>
            </div>
        </form>
    </main>

    <footer>
        <p>สงวนลิขสิทธิ์ 2026 แผนกวิชาเทคโนโลยีสารสนเทศ วิทยาลัยเทคนิคสุราษฎร์ธานี</p>
    </footer>
</body>
</html>
